<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Patrono - Atena</title>
  <style>
    :root {
      --bg-color: #0f1016;
      --panel-bg: #1a1a2e;
      --text-color: #ffffff;
      --accent-color: #4f46e5;
      --danger-color: #ef4444;
      --border-color: #33334d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header e Botão de Configurações */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(26, 26, 46, 0.8);
      border-bottom: 1px solid var(--border-color);
    }

    .atena-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .atena-avatar-img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: #444;
    }

    .settings-button {
      background: transparent;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--text-color);
      padding: 4px;
    }

    /* Modal de Configurações */
    .settings-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .settings-modal[hidden] {
      display: none;
    }

    .settings-sheet {
      background: var(--panel-bg);
      color: var(--text-color);
      padding: 20px;
      border-radius: 14px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border-color);
    }

    .settings-sheet label {
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    .settings-sheet input {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #111118;
      color: var(--text-color);
      width: 100%;
      font-size: 0.95rem;
    }

    .settings-help {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .settings-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .settings-actions button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
    }

    #settingsSave { background: var(--accent-color); color: #fff; }
    #settingsClear { background: var(--danger-color); color: #fff; }
    #settingsClose { background: none; border: none; color: #fff; font-size: 1.4rem; align-self: flex-end; cursor: pointer; }

    /* Área de Chat */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .message.atena {
      background: #252542;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .message.user {
      background: var(--accent-color);
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    /* Input de Envio */
    .chat-input-area {
      display: flex;
      padding: 12px 16px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #111118;
      color: var(--text-color);
      font-size: 0.95rem;
    }

    .chat-input-area button {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #settingsStatus {
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="atena-info">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Atena" class="atena-avatar-img" id="headerAvatar">
      <div>
        <strong>Atena</strong>
        <div style="font-size: 0.75rem; color: #94a3b8;">Conselheira Estratégica</div>
      </div>
    </div>
    <button id="settingsButton" type="button" class="settings-button" aria-label="Configurações">⚙️</button>
  </header>

  <!-- Janela de Chat -->
  <div class="chat-container" id="chatContainer">
    <div class="message atena">Caio, sistema limpo e pronto do zero. Traga uma decisão, plano ou problema e eu organizo com você.</div>
  </div>

  <!-- Barra de Mensagem -->
  <div class="chat-input-area">
    <input type="text" id="userInput" placeholder="Converse com a Atena..." autocomplete="off">
    <button type="button" id="sendButton">Enviar</button>
  </div>

  <!-- Modal de Configurações -->
  <div id="settingsModal" class="settings-modal" hidden>
    <section class="settings-sheet" role="dialog" aria-modal="true">
      <button id="settingsClose" type="button">×</button>
      <h2>Configurações da Atena</h2>
      
      <label for="geminiApiKey">Chave Gemini</label>
      <input id="geminiApiKey" type="password" autocomplete="off" placeholder="Cole sua chave aqui">
      
      <label for="atenaAvatarUrl">Foto da Atena (URL opcional)</label>
      <input id="atenaAvatarUrl" type="url" placeholder="https://site.com/avatar.png">
      
      <p class="settings-help">Deixe a foto vazia para usar o padrão.</p>
      <p id="settingsStatus"></p>
      
      <div class="settings-actions">
        <button id="settingsSave" type="button">Salvar</button>
        <button id="settingsClear" type="button">Limpar</button>
      </div>
    </section>
  </div>

  <script>
    // Elementos do DOM
    const settingsModal = document.getElementById('settingsModal');
    const settingsButton = document.getElementById('settingsButton');
    const settingsClose = document.getElementById('settingsClose');
    const settingsSave = document.getElementById('settingsSave');
    const settingsClear = document.getElementById('settingsClear');
    const geminiApiKeyInput = document.getElementById('geminiApiKey');
    const atenaAvatarUrlInput = document.getElementById('atenaAvatarUrl');
    const settingsStatus = document.getElementById('settingsStatus');
    const headerAvatar = document.getElementById('headerAvatar');
    
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');

    // Carregar configurações salvas
    function loadSettings() {
      const savedKey = localStorage.getItem('geminiApiKey') || '';
      const savedAvatar = localStorage.getItem('atenaAvatarUrl') || '';
      
      geminiApiKeyInput.value = savedKey;
      atenaAvatarUrlInput.value = savedAvatar;

      if (savedAvatar.trim()) {
        headerAvatar.src = savedAvatar.trim();
      }
    }

    // Eventos do Modal
    settingsButton.addEventListener('click', () => settingsModal.removeAttribute('hidden'));
    settingsClose.addEventListener('click', () => settingsModal.setAttribute('hidden', ''));

    settingsSave.addEventListener('click', () => {
      const key = geminiApiKeyInput.value.trim();
      const avatar = atenaAvatarUrlInput.value.trim();

      if (!key) {
        settingsStatus.textContent = 'Insira a chave do Gemini.';
        settingsStatus.style.color = '#f87171';
        return;
      }

      localStorage.setItem('geminiApiKey', key);
      localStorage.setItem('atenaAvatarUrl', avatar);

      settingsStatus.textContent = 'Salvo com sucesso!';
      settingsStatus.style.color = '#4ade80';
      
      loadSettings();
      setTimeout(() => {
        settingsModal.setAttribute('hidden', '');
        settingsStatus.textContent = '';
      }, 1000);
    });

    settingsClear.addEventListener('click', () => {
      localStorage.removeItem('geminiApiKey');
      localStorage.removeItem('atenaAvatarUrl');
      geminiApiKeyInput.value = '';
      atenaAvatarUrlInput.value = '';
      headerAvatar.src = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100';
      settingsStatus.textContent = 'Dados limpos.';
      settingsStatus.style.color = '#f87171';
    });

    // Função de Comunicação com o Gemini (Modelo estável e limpo)
    async function askAtena(promptText) {
      const apiKey = (localStorage.getItem('geminiApiKey') || '').trim();
      
      if (!apiKey || apiKey.length < 5) {
        throw new Error('Atena ainda não está configurada. Abra a engrenagem e informe a chave Gemini.');
      }

      const MODEL = 'gemini-3.8-flash';
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 60000);

      let response;
      try {
        response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-goog-api-key': apiKey
          },
          signal: controller.signal,
          body: JSON.stringify({
            systemInstruction: {
              parts: [{ text: 'Você é Atena, estrategista pessoal do Projeto Patrono de Caio. Fale em português brasileiro. Seja lúcida, calorosa, direta e prática. Ajude com rotina, saúde, estudos, finanças e decisões.' }]
            },
            contents: [{ role: 'user', parts: [{ text: promptText }] }]
          })
        });
      } catch (error) {
        if (error.name === 'AbortError') {
          throw new Error('A Atena demorou para responder. Tente enviar novamente.');
        }
        throw new Error('Não foi possível conectar à Atena. Verifique sua internet e tente novamente.');
      } finally {
        clearTimeout(timeoutId);
      }

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data?.error?.message || `Erro HTTP ${response.status}`);
      }

      const answer = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!answer) {
        throw new Error('O Gemini não retornou nenhuma resposta.');
      }

      return answer.trim();
    }

    // Gestão do Envio de Mensagens
    async function handleSendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      // Adiciona mensagem do usuário no chat
      appendMessage(text, 'user');
      userInput.value = '';

      // Indicador de "pensando"
      const loadingId = appendMessage('Atena está pensando...', 'atena thinking');

      try {
        const reply = await askAtena(text);
        removeMessage(loadingId);
        appendMessage(reply, 'atena');
      } catch (err) {
        removeMessage(loadingId);
        appendMessage(err.message, 'atena error');
      }
    }

    function appendMessage(text, className) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${className}`;
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      
      // Retorna ID temporal único se precisar remover
      const tempId = 'msg_' + Date.now();
      msgDiv.id = tempId;
      return tempId;
    }

    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    sendButton.addEventListener('click', handleSendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSendMessage();
    });

    // Inicialização
    window.addEventListener('DOMContentLoaded', loadSettings);
  </script>
</body>
</html>
