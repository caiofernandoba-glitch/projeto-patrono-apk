name: Gerar APK Patrono
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restaurar fonte e corrigir Atena
        run: |
          cat source.parts/atena-{000..012} | base64 -d > source.zip
          rm -rf app backend build.gradle settings.gradle gradle.properties
          unzip -o source.zip
          echo '' | base64 -d > /tmp/fix_atena.py
          python3 /tmp/fix_atena.py
          cp overrides/index.html app/src/main/assets/index.html
      - name: Preparar Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.11.1/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Patrono-0.5.3-Atena-Gemini-1.5-Flash-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.3
          name: Patrono 0.5.3 - Atena Gemini 1.5 Flash
          fail_on_unmatched_files: true
          overwrite_files: true
          body: APK 0.5.3 com endpoint explícito do Gemini em askAtena.
          files: app/build/outputs/apk/debug/app-debug.apk