name: Gerar APK Patrono
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restaurar fonte
        run: |
          cat source.parts/atena-{000..012} | base64 -d > source.zip
          rm -rf app backend build.gradle settings.gradle gradle.properties
          unzip -o source.zip
          cp overrides/index.html app/src/main/assets/index.html
      - name: Preparar Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        env:
          ATENA_ENDPOINT: ${{ secrets.ATENA_ENDPOINT }}
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.11.1/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Patrono-0.4.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.3
          name: Patrono 0.4.3
          fail_on_unmatched_files: true
          overwrite_files: true
          body: APK 0.4.3 com Observatório Caio integrado à Rotina e avatar transparente da Atena.
          files: app/build/outputs/apk/debug/app-debug.apk