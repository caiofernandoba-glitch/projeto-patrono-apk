name: Gerar APK Patrono
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restaurar fonte e atualizar Atena
        run: |
          cat source.parts/atena-{000..012} | base64 -d > source.zip
          rm -rf app backend build.gradle settings.gradle gradle.properties
          unzip -o source.zip
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('overrides/index.html')
          s = p.read_text()
          endpoint = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}'
          out, count = re.subn(r'const\s+(?:MODEL\s*=\s*[\x27][^\x27]+[\x27];\s*)?endpoint\s*=\s*`https://generativelanguage\.googleapis\.com/v1beta/models/[^`]+:generateContent\?key=\$\{apiKey\}`;', 'const endpoint = `' + endpoint + '`;', s, count=1)
          if count != 1 or endpoint not in out or 'models/models/' in out:
              raise SystemExit('askAtena: endpoint final invalido')
          p.write_text(out)
          PY
          cp overrides/index.html app/src/main/assets/index.html
      - name: Preparar Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.11.1/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Patrono-0.5.4-Atena-Gemini-3.8-Flash-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.4
          name: Patrono 0.5.4 - Atena Gemini 3.8 Flash
          fail_on_unmatched_files: true
          body: APK 0.5.4 com Gemini 3.8 Flash, substituto atual do Gemini 1.5 Flash descontinuado.
          files: app/build/outputs/apk/debug/app-debug.apk