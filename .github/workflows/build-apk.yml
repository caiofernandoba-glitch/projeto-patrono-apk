name: Gerar APK Patrono
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restaurar fonte e forçar endpoint Gemini
        run: |
          cat source.parts/atena-{000..012} | base64 -d > source.zip
          rm -rf app backend build.gradle settings.gradle gradle.properties
          unzip -o source.zip
          python3 - <<'PY'
          from pathlib import Path
          p = Path('overrides/index.html')
          s = p.read_text()
          old = "const MODEL = 'gemini-1.5-flash';\n      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`;"
          new = "const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;"
          if old not in s:
              raise SystemExit('askAtena: trecho esperado nao encontrado')
          p.write_text(s.replace(old, new, 1))
          final = p.read_text()
          required = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}'
          if required not in final or 'models/models/' in final:
              raise SystemExit('askAtena: endpoint final invalido')
          PY
          cp overrides/index.html app/src/main/assets/index.html
      - name: Preparar Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        env:
          ATENA_ENDPOINT: ${{ secrets.ATENA_ENDPOINT }}
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.11.1/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Patrono-0.5.3-Atena-Gemini-1.5-Flash-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.3
          name: Patrono 0.5.3 — Atena Gemini 1.5 Flash
          fail_on_unmatched_files: true
          overwrite_files: true
          body: APK 0.5.3 com endpoint explícito do Gemini em askAtena.
          files: app/build/outputs/apk/debug/app-debug.apk