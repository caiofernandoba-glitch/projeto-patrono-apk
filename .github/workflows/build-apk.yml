name: Gerar APK Patrono
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restaurar e atualizar fonte principal da Atena
        run: |
          cat source.parts/atena-{000..012} | base64 -d > source.zip
          rm -rf app backend build.gradle settings.gradle gradle.properties
          unzip -o source.zip
          python3 - <<'PY'
          from pathlib import Path
          old = "const MODEL = 'gemini-1.5-flash';\n      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`;"
          new = "const MODEL = 'gemini-3.8-flash';\n      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`;"
          main = Path('overrides/index.html')
          text = main.read_text()
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('askAtena: bloco esperado não encontrado')
          for name in (main, Path('app/src/main/assets/index.html')):
              name.write_text(text)
              final = name.read_text()
              if new not in final or 'gemini-1.5-flash' in final or 'models/models/' in final:
                  raise SystemExit(f'{name}: fonte final inválida')
          PY
      - name: Persistir fonte corrigida no repositório
        run: |
          rm -f source-fixed.zip source-fixed.b64
          zip -qr source-fixed.zip settings.gradle overrides app backend build.gradle gradle.properties README.md COMO_GERAR_APK.txt .github
          base64 -w0 source-fixed.zip > source-fixed.b64
          python3 - <<'PY'
          from pathlib import Path
          b = Path('source-fixed.b64').read_text()
          n = 13
          size = (len(b) + n - 1) // n
          for i in range(n):
              Path(f'source.parts/atena-{i:03}').write_text(b[i*size:(i+1)*size)
          PY
          rm -f source-fixed.zip source-fixed.b64
          if ! git diff --quiet -- source.parts/atena-000 source.parts/atena-001 source.parts/atena-002 source.parts/atena-003 source.parts/atena-004 source.parts/atena-005 source.parts/atena-006 source.parts/atena-007 source.parts/atena-008 source.parts/atena-009 source.parts/atena-010 source.parts/atena-011 source.parts/atena-012; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add source.parts/atena-000 source.parts/atena-001 source.parts/atena-002 source.parts/atena-003 source.parts/atena-004 source.parts/atena-005 source.parts/atena-006 source.parts/atena-007 source.parts/atena-008 source.parts/atena-009 source.parts/atena-010 source.parts/atena-011 source.parts/atena-012
            git commit -m "Persiste index.html da Atena no Gemini 3.8 Flash"
            git push
          fi
      - name: Preparar Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.11.1/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Patrono-0.5.4-Atena-Gemini-3.8-Flash-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.4
          name: Patrono 0.5.4 - Atena Gemini 3.8 Flash
          fail_on_unmatched_files: true
          overwrite_files: true
          body: APK 0.5.4 com index.html persistido e validado antes da compilação.
          files: app/build/outputs/apk/debug/app-debug.apk