name: Gerar APK Patrono
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restaurar fonte principal da Atena
        run: |
          cat source.parts/atena-{000..012} | base64 -d > source.zip
          rm -rf app backend build.gradle settings.gradle gradle.properties
          unzip -o source.zip
      - name: Corrigir e validar index.html antes do build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = "const MODEL = 'gemini-1.5-flash';\n      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`;"
          new = "const MODEL = 'gemini-1.5-flash-latest';\n      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`;"
          main = Path('overrides/index.html')
          text = main.read_text()
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('askAtena: bloco-modelo esperado não encontrado')
          for name in (main, Path('app/src/main/assets/index.html')):
              name.write_text(text)
              final = name.read_text()
              if new not in final:
                  raise SystemExit(f'{name}: modelo final incorreto')
              if "const MODEL = 'gemini-1.5-flash';" in final or 'models/models/' in final:
                  raise SystemExit(f'{name}: modelo legado ou rota duplicada')
          PY
      - name: Preparar Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.11.1/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Patrono-0.5.4-Atena-Gemini-1.5-Flash-Latest-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.4
          name: Patrono 0.5.4 - Atena Gemini 1.5 Flash Latest
          fail_on_unmatched_files: true
          overwrite_files: true
          body: APK 0.5.4 com index.html da Atena corrigido e validado antes da compilação.
          files: app/build/outputs/apk/debug/app-debug.apk