name: Gerar APK Patrono 0.4.8
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restaurar fonte do Patrono
        run: |
          cat source048.parts/{000..012} | base64 -d > source.zip
          rm -rf app backend build.gradle settings.gradle gradle.properties
          unzip -o source.zip
          cat ui.parts/{000..003} | base64 -d | gunzip > app/src/main/assets/index.html
      - name: Configurar Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Compilar APK
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.11.1/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Patrono-0.4.8-Atena-direta-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.8
          name: Patrono 0.4.8 — Atena direta
          fail_on_unmatched_files: true
          body: APK com Atena configurável pelo próprio aparelho, usando a chave Gemini salva localmente.
          files: app/build/outputs/apk/debug/app-debug.apk